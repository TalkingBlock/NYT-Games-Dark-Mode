<!DOCTYPE html>
<html lang="en">
    <head>
        <title>NYT Games Dark Mode</title>
        <link rel="stylesheet" href="popup.css">
        <script src="scripts/popup.js" defer></script>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <img src="icons/nytdark48.png">
            </div>
            <h1>NYT Games Dark Mode :D</h1>
        </header>
        <main class="content">
            <section class="dark-mode">
                <h2>Dark Mode</h2>
                <div class="darkmode-box scrollable">
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="mini-crossword">
                            <span class="slider"></span>
                        </label>
                        <p>Mini Crossword</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="the-crossword">
                            <span class="slider"></span>
                        </label>
                        <p>The Crossword</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="spelling-bee">
                            <span class="slider"></span>
                        </label>
                        <p>Spelling Bee</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="pips">
                            <span class="slider"></span>
                        </label>
                        <p>Pips</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="strands">
                            <span class="slider"></span>
                        </label>
                        <p>Strands</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="connections">
                            <span class="slider"></span>
                        </label>
                        <p>Connections</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="letter-boxed">
                            <span class="slider"></span>
                        </label>
                        <p>Letter Boxed</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="tiles">
                            <span class="slider"></span>
                        </label>
                        <p>Tiles</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="sudoku">
                            <span class="slider"></span>
                        </label>
                        <p>Sudoku</p>
                    </div>
                    <div class="toggle-line">
                        <label class="switch">
                            <input type="checkbox" id="games-menu">
                            <span class="slider"></span>
                        </label>
                        <p>Games Menu</p>
                    </div>
                </div>
            </section>
            <section class="color-custom">
                <h2>Color Customization</h2>
                <div class="color-box">
                    <p><strong>Placeholder !!! (WIP) !!!</strong></p>
                </div>
            </section>
            <section class="misc">
                <h2>Miscellaneous</h2>
                <div class="misc-box">
                    <p><strong>Placeholder !!! (WIP) !!!</strong></p>
                </div>
            </section>
        </main>
    </body>
</html>
