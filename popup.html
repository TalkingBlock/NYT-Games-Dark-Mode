<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>NYT Games Dark Mode</title>
        <link rel="stylesheet" href="popup.css">
        <script type="module" src="scripts/popup/popup.js"></script>
    </head>
    <body>
        <header>
            <div class="logo">
                <img src="icons/nytdark48.png">
            </div>
            <h1>NYT Games Dark Mode</h1>
        </header>
        <div class="page-buttons center">
            <div class="dark-mode-button enabled">
                <button class="center" data-page="dark-mode-button">
                    <img src="svgs/popup/moon.svg">
                    Dark Mode
                </button>
            </div>
            <div class="custom-colors-button">
                <button class="center" data-page="custom-colors-button">
                    <img src="svgs/popup/palette.svg">
                    Custom Colors
                </button>
            </div>
            <div class="extra-features-button">
                <button class="center" data-page="extra-features-button">
                    <img src="svgs/popup/tools.svg">
                    Extra Features
                </button>
            </div>
        </div>
        <div class="extension-pages center">
            <div class="dark-mode-page center">
                <div class="wrap">
                    <div class="games-sliders">
                        <label class="section-header">
                            <span class="section-title">Games</span>
                            <span class="switch big">
                                <input type="checkbox" id="games-main" />
                                <span class="slider"></span>
                            </span>
                        </label>
                        <div class="sub-toggles">
                            <label class="toggle-line small">
                                <span class="toggle-label">The Crossword</span>
                                <span class="switch small">
                                    <input type="checkbox" id="the-crossword" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Midi Crossword</span>
                                <span class="switch small">
                                    <input type="checkbox" id="midi-crossword" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Mini Crossword</span>
                                <span class="switch small">
                                    <input type="checkbox" id="mini-crossword" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Connections</span>
                                <span class="switch small">
                                    <input type="checkbox" id="connections" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Spelling Bee</span>
                                <span class="switch small">
                                    <input type="checkbox" id="spelling-bee" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Pips</span>
                                <span class="switch small">
                                    <input type="checkbox" id="pips" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Strands</span>
                                <span class="switch small">
                                    <input type="checkbox" id="strands" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Letter Boxed</span>
                                <span class="switch small">
                                    <input type="checkbox" id="letter-boxed" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Tiles</span>
                                <span class="switch small">
                                    <input type="checkbox" id="tiles" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Sudoku</span>
                                <span class="switch small">
                                    <input type="checkbox" id="sudoku" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="archives-sliders">
                        <label class="section-header">
                            <span class="section-title">Archives</span>
                            <span class="switch big">
                                <input type="checkbox" id="archives-main" />
                                <span class="slider"></span>
                            </span>
                        </label>
                        <div class="sub-toggles">
                            <label class="toggle-line small">
                                <span class="toggle-label">Crosswords</span>
                                <span class="switch small">
                                    <input type="checkbox" id="archive-crosswords" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Connections</span>
                                <span class="switch small">
                                    <input type="checkbox" id="archive-connections" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Spelling Bee</span>
                                <span class="switch small">
                                    <input type="checkbox" id="archive-spelling-bee" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Wordle</span>
                                <span class="switch small">
                                    <input type="checkbox" id="archive-wordle" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Strands</span>
                                <span class="switch small">
                                    <input type="checkbox" id="archive-strands" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="misc-sliders">
                        <label class="section-header">
                            <span class="section-title">Misc.</span>
                            <span class="switch big">
                                <input type="checkbox" id="misc-main" />
                                <span class="slider"></span>
                            </span>
                        </label>
                        <div class="sub-toggles">
                            <label class="toggle-line small">
                                <span class="toggle-label">Games Menu</span>
                                <span class="switch small">
                                    <input type="checkbox" id="games-menu" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Statistics</span>
                                <span class="switch small">
                                    <input type="checkbox" id="crossword-stats" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Custom Wordle</span>
                                <span class="switch small">
                                    <input type="checkbox" id="custom-wordle" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">The Athletic Connections</span>
                                <span class="switch small">
                                    <input type="checkbox" id="ta-connections" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                            <label class="toggle-line small">
                                <span class="toggle-label">Misc Pages</span>
                                <span class="switch small">
                                    <input type="checkbox" id="misc-pages" />
                                    <span class="slider"></span>
                                </span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="custom-colors-page center hidden">
                <div class="wrap">
                    <div class="color-picker">
                        <div class="wrap">
                            <div class="top">
                                <div class="sv" id="sv" aria-label="Saturation Value Picker">
                                    <div class="sv-mask" aria-hidden="true"></div>
                                    <div class="sv-cursor" id="svCursor"></div>
                                </div>
                                <div class="below">
                                    <div class="preview" id="preview" aria-label="Selected Color Preview"></div>
                                    <div class="hue" id="hue" aria-label="Hue Slider">
                                        <div class="hue-cursor" id="hueCursor"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="bottom">
                                <div class="row hex-row">
                                    <div class="value" id="hexOut">
                                        <span class="hex-text">#FF0000</span>
                                        <span class="hex-indicator" id="hexIndicator" aria-live="polite"></span>
                                        <span class="hex-actions">
                                            <button id="copyHex" title="Copy Hexcode"><img src="svgs/popup/copy.svg"></button>
                                            <button id="pasteHex" title="Paste Hexcode"><img src="svgs/popup/paste.svg"></button>
                                            <button id="resetHex" title="Reset Hexcode"><img src="svgs/popup/reset.svg"></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div> 
                    </div>
                    <div class="color-info">
                        <div class="wrap">
                            <div class="color-info-tabs">
                                <button class="color-info-tab enabled" data-color-panel="crosswords">Crosswords</button>
                                <button class="color-info-tab" data-color-panel="sudoku">Sudoku</button>
                                <button class="color-info-help">?</button>
                            </div>
                            <div class="color-info-panels">
                                <div class="color-info-panel" id="panel-crosswords">
                                    <label class="color-option" data-key="cw_cell_borders">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Cell Borders</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color" checked>
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_letter_number_in_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Letter + Number In Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_correct_letter_in_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Correct Letter in Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_empty_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Empty Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_prefilled_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Prefilled Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_shaded_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Shaded Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_related_cell_clue">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Related Cell + Clue</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_related_shaded_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Related + Shaded Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_highlighted_cell_clue">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Highlighted Cell + Clue</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_shaded_highlighted_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Shaded + Highlighted Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_selected_cell_clue">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Selected Cell + Clue</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>                                                                                                                
                                    <label class="color-option" data-key="cw_shaded_selected_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Shaded + Selected Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label> 
                                    <label class="color-option" data-key="cw_circle_within_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Circle within Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>                   
                                    <label class="color-option" data-key="cw_main_selected_clue_bg">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Main Selected Clue BG</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="cw_main_selected_clue_text">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Main Selected Clue Text</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="crossword-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                </div>
                                <div class="color-info-panel hidden" id="panel-sudoku">
                                    <label class="color-option" data-key="sd_board_frame">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Board Frame</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_empty_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Empty Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_prefilled_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Prefilled Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_affected_no_number_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Affected + No Number Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_affected_number_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Affected + Number Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_selected_cell">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Selected Cell</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_filled_selected_number">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Filled + Selected Number</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_selected_number">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Selected Number</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_prefilled_selected_number">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Prefilled + Selected Number</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_numbers">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Numbers</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                    <label class="color-option" data-key="sd_candidate_number">
                                        <span class="color-option-body">
                                            <span class="color-option-text">Candidate Numbers</span>
                                            <span class="element-item">
                                                <span class="element-hex-box" aria-hidden="true"></span>
                                                <span class="element-hex">#FFFFFF</span>
                                            </span>
                                        </span>
                                        <input type="radio" name="sudoku-color">
                                        <span class="radio-ui"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="color-presets">
                                <button class="color-preset enabled" data-preset="light">Light</button>
                                <button class="color-preset" data-preset="dark">Dark</button>
                                <button class="color-preset" data-preset="custom">Custom</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="extra-features-page center hidden">
                <div class="wrap">
                    <div class="extra-features-box">Extra Features Coming Soon!</div>
                </div>
            </div>
        </div>
    </body>
</html>
